[project]
name = "meninas-digitais-agents"
version = "0.0.1"
description = "Assistente de IA multiagente do Programa Meninas Digitais"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kevin Rehbein", email = "kevin2.rehbein@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.67.0",
    "python-dotenv>=1.1.0",
    "langchain[google-genai]>=1.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openrouter>=0.2.9",
    "langchain-neo4j>=0.11.0",
    "langgraph>=1.2.16",
    "gradio_client",
]

[project.urls]

[project.optional-dependencies]
dev = ["ruff", "pyright", "pytest", "pytest-xdist"]

[tool.ruff]
line-length = 88
target-version = "py314"
fix = true
show-fixes = true
indent-width = 4
exclude = ["venv", ".venv", "env", ".env", "node_modules", "__pycache__"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "T201",   # Checks for print statements, 
  "COM812", # Checks for the absence of trailing commas.
  "INP001", # Checks for packages that are missing an __init__.py file.
  "D",      # All pydocstyle (D)
  "ANN401", # Checks that function arguments are annotated with a more specific type than Any.
  "ERA001", # Checks for commented-out Python code.
  "A004",   # Shadowing Python Builtin
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["agents"]


[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.14"
include = ["src", 'tests']
exclude = [
    "**/venv",
    "**/.venv",
    "**/env",
    "**/.env",
    "**/node_modules",
    "**/__pycache__", "**/.*",
]
venv = ".venv"
venvPath = "."
executionEnvironments = [{ root = "src" }]


[tool.pytest.ini_options]
addopts = "-s --color=yes --tb=short"
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }
